<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Details</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        margin: 0;
      }
      header {
        background: #222;
        color: #fff;
        padding: 1.5rem 0;
        text-align: center;
      }
      nav a {
        color: #fff;
        margin: 0 1rem;
        text-decoration: none;
        font-weight: bold;
      }
      .container {
        max-width: 900px;
        margin: 2rem auto;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        padding: 2rem;
      }
      .blog-title {
        color: #222;
        margin-top: 0;
      }
      .blog-meta {
        color: #888;
        font-size: 0.95rem;
        margin-bottom: 1rem;
      }
      .blog-content {
        line-height: 1.7;
      }
      .back-link {
        display: inline-block;
        margin-bottom: 2rem;
        color: #344cb7;
        text-decoration: none;
        font-weight: bold;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      footer {
        text-align: center;
        padding: 1.5rem 0;
        background: #222;
        color: #fff;
        margin-top: 2rem;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const posts = [
          {
            title: "Welcome to the WebHire Blog!",
            meta: "<i class='fa-regular fa-calendar'></i> January 9, 2026 | <i class='fa-regular fa-user'></i> Admin",
            content:
              "Stay tuned for updates, tips, and insights on web development, hiring trends, and more. This is your go-to place for the latest news and articles from the WebHire team.",
          },
          {
            title: "How to Build a Modern Web App",
            meta: "<i class='fa-regular fa-calendar'></i> January 5, 2026 | <i class='fa-regular fa-user'></i> Gaurav Koli",
            content:
              "Building a modern web application requires a blend of frontend and backend skills. In this post, we explore the essential technologies and best practices to create scalable, maintainable, and user-friendly web apps.",
          },
          {
            title: "Top Skills for Web Developers in 2026",
            meta: "<i class='fa-regular fa-calendar'></i> January 2, 2026 | <i class='fa-regular fa-user'></i> WebHire Team",
            content:
              "Web development is constantly evolving. Discover the top skills you need to stay ahead in 2026, from JavaScript frameworks to cloud deployment and beyond.",
          },
          {
            title: "Why Soft Skills Matter in Tech Hiring",
            meta: "<i class='fa-regular fa-calendar'></i> January 11, 2026 | <i class='fa-regular fa-user'></i> Priya Sharma",
            content:
              "Technical expertise is crucial, but soft skills like communication, teamwork, and adaptability are what set great developers apart. Learn why companies are prioritizing these qualities in 2026.",
          },
          {
            title: "The Rise of Remote Work in Tech",
            meta: "<i class='fa-regular fa-calendar'></i> January 11, 2026 | <i class='fa-regular fa-user'></i> Alex Morgan",
            content:
              "Remote work has revolutionized the tech industry, breaking down geographical barriers and enabling companies to tap into a truly global talent pool. In 2026, organizations are not just adapting—they are thriving by embracing flexible work models, investing in digital collaboration tools, and fostering inclusive remote cultures.\n\nKey Trends:\n- Companies are hiring talent from across continents, leading to more diverse and innovative teams.\n- Digital collaboration platforms have become the backbone of productivity, with AI-driven tools streamlining communication and project management.\n- Flexible schedules and asynchronous work are now standard, supporting better work-life balance.\n\nChallenges:\n- Maintaining team cohesion and company culture in a virtual environment.\n- Addressing time zone differences and ensuring effective communication.\n- Cybersecurity and data privacy concerns with distributed teams.\n\nOpportunities:\n- Access to a wider talent pool and reduced overhead costs.\n- Enhanced employee satisfaction and retention.\n- The ability to quickly scale teams and projects globally.\n\nAs remote work continues to evolve, tech companies that prioritize adaptability, communication, and employee well-being are poised to lead the industry into a more connected and productive future.",
          },
        ];
        function getQueryParam(name) {
          const urlParams = new URLSearchParams(window.location.search);
          return urlParams.get(name);
        }
        const postId = parseInt(getQueryParam("post"), 10);
        const post = posts[postId - 1];
        if (post) {
          document.getElementById("blog-title").textContent = post.title;
          document.getElementById("blog-meta").innerHTML = post.meta;
          document.getElementById("blog-content").textContent = post.content;
        } else {
          document.getElementById("blog-title").textContent =
            "Blog Post Not Found";
          document.getElementById("blog-meta").textContent = "";
          document.getElementById("blog-content").textContent =
            "Sorry, the blog post you are looking for does not exist.";
        }
      });
    </script>
  </head>
  <body>
    <header>
      <h1>WebHire Blog</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="frontend.html">Frontend</a>
        <a href="backend.html">Backend</a>
        <a href="fullstack.html">Fullstack</a>
      </nav>
    </header>
    <div class="container">
      <a href="blog.html" class="back-link">&larr; Go Back to Blog</a>
      <h2 class="blog-title" id="blog-title"></h2>
      <div class="blog-meta" id="blog-meta"></div>
      <div class="blog-content" id="blog-content"></div>
    </div>
    <footer>&copy; 2026 WebHire. All rights reserved.</footer>
  </body>
</html>
